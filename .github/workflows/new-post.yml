name: new-post

on:
  workflow_dispatch:
    inputs:
      name:
        description: 'post slug / name'
        default: 'new-post'
        required: true

jobs:
  run:
    name: new file
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: copy
        env:
          POST_NAME: ${{ github.event.inputs.name }}
        run: |
          POST_TITLE="$POST_NAME" POST_DATE=$(date -u '+%Y-%m-%d') ./scripts/templates/new.template.sh

      - name: check
        env:
          POST_NAME: ${{ github.event.inputs.name }}
        run: |
          cat "./content/blog/${POST_NAME}.md"

      - name: Commit changes
        uses: EndBug/add-and-commit@v9
        with:
          message: "post: new ${{ github.event.inputs.name }}"
          add: './content/blog/*.md'
          new_branch: post/${{ github.event.inputs.name }}

      - name: create pull request
        run: gh pr create -B master -H "post/${POST_NAME}" --fill
        env:
          POST_NAME: ${{ github.event.inputs.name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
